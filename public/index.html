<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="5;url=https://www.scheels.ca">
<title>Redirecting...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
min-height: 100vh;
display: block;
flex-direction: column;
align-items: center;
justify-content: center;
background: #0a0a0a;
font-family: 'DM Sans', sans-serif;
color: #e0e0e0;
overflow: auto;
}
.container {
display: block;
flex-direction: column;
align-items: center;
gap: 2rem;
padding: 2rem;
animation: fadeIn 0.6s ease-out;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}
.image-wrapper {
border-radius: 12px;
box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.image-wrapper img {
display: block;
width: 700vw;
height: auto;
object-fit: contain;
}
.status {
display: flex;
flex-direction: column;
align-items: center;
gap: 0.75rem;
}
.status p {
font-size: 0.95rem;
color: #888;
letter-spacing: 0.02em;
}
.progress-track {
width: 200px;
height: 3px;
background: #222;
border-radius: 3px;
overflow: hidden;
}
.progress-bar {
height: 100%;
width: 0%;
background: #e0e0e0;
border-radius: 3px;
animation: fillBar 5s linear forwards;
}
@keyframes fillBar {
from { width: 0%; }
to { width: 100%; }
}

/* Big SCHEELS overlay */
.scheels-overlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
pointer-events: none;
z-index: 9999;
opacity: 0;
transition: none;
}
.scheels-overlay.visible {
opacity: 1;
animation: scheelsFadeIn 0.8s ease-out forwards;
}
@keyframes scheelsFadeIn {
from { opacity: 0; transform: scale(0.85); }
to { opacity: 1; transform: scale(1); }
}
.scheels-text {
font-family: 'DM Sans', sans-serif;
font-weight: 700;
font-size: clamp(4rem, 15vw, 12rem);
color: #ffffff;
text-transform: uppercase;
letter-spacing: 0.08em;
text-shadow:
0 0 40px rgba(255, 255, 255, 0.3),
0 0 80px rgba(255, 255, 255, 0.1);
}
</style>
</head>
<body>
<div class="container">
<div class="image-wrapper">
<img src="./image.png" alt="Redirect image">
</div>
<div class="status">
<div class="progress-track">
<div class="progress-bar"></div>
</div>
</div>
</div>

<div class="scheels-overlay" id="scheelsOverlay">
<div class="scheels-text">SCHEEL</div>
</div>

<script>
let seconds = 5;
const countdownEl = document.getElementById('countdown');
const interval = setInterval(() => {
seconds--;
if (countdownEl) countdownEl.textContent = seconds;
if (seconds <= 0) {
clearInterval(interval);
window.location.href = 'https://www.scheels.ca';
}
}, 1000);

// Show SCHEELS text after 4 seconds
setTimeout(() => {
document.getElementById('scheelsOverlay').classList.add('visible');
}, 4000);

window.onload = function() {
window.scrollTo(0, 0);
const targetX = (document.body.scrollWidth - window.innerWidth) * .28;
const targetY = (document.body.scrollHeight - window.innerHeight) * .60;
const duration = 4000;
const start = performance.now();
function pan(now) {
const elapsed = now - start;
const progress = Math.min(elapsed / duration, 1);
const ease = progress < 0.5
? 2 * progress * progress
: 1 - Math.pow(-2 * progress + 2, 2) / 2;
window.scrollTo(targetX * ease, targetY * ease);
if (progress < 1) requestAnimationFrame(pan);
}
requestAnimationFrame(pan);
};
</script>
</body>
</html>
